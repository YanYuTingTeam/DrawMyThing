# 铅笔/橡皮擦音效
tool-sound: true
# 强制晴天
force-clear-weather: true
# 不掉饱食度
no-hunger: true
# 不受伤害
no-damage: true

chat:
  format: '<%player%> &r%message%'

item:
  leave:
    material: WATCH # 他妈的这个CLOCK为什么叫WATCH 看一遍吐槽一边
    data: 0
    slot: 8
    name: '&c返回大厅'
    lore:
      - '&7点击返回大厅'
  pencil:
    material: WOOD_SWORD
    data: 0
    slot: 0
    name: '&a默认画笔(剑准心对准画布，按住右键作画)'
    lore:
      - '&7右键方块进行绘画'
    sound: 'FIZZ,1,1'
  big-pencil:
    material: IRON_SWORD
    data: 0
    slot: 1
    name: '&a&l粗画笔(剑准心对准画布，按住右键作画)'
    lore:
      - '&7右键方块进行十字绘画'
    sound: 'FIZZ,1,1'
  eraser:
    material: TNT
    data: 0
    slot: 2
    name: '&c清空画布(右键清空)'
    lore:
      - '&7右键清空画布'
    sound: 'EXPLODE,1,1'
  color-picker:
    material: BUCKET
    data: 0
    slot: 3
    name: '&9填充画布(右键填充)'
    lore:
      - '&7右键用选中的颜色填充画布'
    sound: 'SPLASH,1,0.8'

color-picker:
  title: '&4&l选择颜色'
  colors:
    - {wool: 0, name: '&f&l白色', slot: 0}
    - {wool: 1, name: '&6&l橙色', slot: 1}
    - {wool: 2, name: '&5&l品红色', slot: 2}
    - {wool: 3, name: '&b&l淡蓝色', slot: 3}
    - {wool: 4, name: '&e&l黄色', slot: 4}
    - {wool: 5, name: '&a&l黄绿色', slot: 5}
    - {wool: 6, name: '&d&l粉红色', slot: 6}
    - {wool: 7, name: '&8&l灰色', slot: 7}
    - {wool: 8, name: '&7&l淡灰色', slot: 8}
    - {wool: 9, name: '&3&l青色', slot: 10}
    - {wool: 10, name: '&5&l紫色', slot: 11}
    - {wool: 11, name: '&9&l蓝色', slot: 12}
    - {wool: 12, name: '&6&l棕色', slot: 13}
    - {wool: 13, name: '&2&l绿色', slot: 14}
    - {wool: 14, name: '&c&l红色', slot: 15}
    - {wool: 15, name: '&0&l黑色', slot: 16}

beforestart:
  time: 15
  broadcast:
    sound:
      - 'ORB_PICKUP,1,1.2'
      - 'ORB_PICKUP,1,1.4'
      - 'ORB_PICKUP,1,1.6'
      - 'ORB_PICKUP,1,1.8'
      - 'ORB_PICKUP,1,2'
    title: '&a%time%'
    subtitle: ''
    fade-in: 5
    stay: 10
    fade-out: 5
  showtime: [5, 4, 3, 2, 1]

aftergame:
  time: 10 # 对局结束后, n秒后退出游戏
  broadcast:
    sound: ''
    title: '&c%endtime%'
    subtitle: ''
    fade-in: 5
    stay: 10
    fade-out: 5
  showtime: []

game:
  round: 3
  round-time: 90
  nextroundTime: 4
  hints:
    - 30
    - 60
  actionbar: '&f&l提示 &r&f- %tip%'
  builder-actionbar: '&e&l题目: &r&f%paintname%'
  builder-teleport-delay: 0
  builderToPlanter: 
    time: 5
    sound: 'NOTE_BASS,1,1'
  started:
    title: ''
    subtitle: ''
    sound: 'NOTE_PLING,1,1'
    fade-in: 0
    stay: 0
    fade-out: 0
  guessed:
      title: ''
      subtitle: '&e(+%getscore%) &a分 你猜出了题目!'
      fade-in: 15
      stay: 40
      fade-out: 15
  broadcast:
    sound:
      - 'ORB_PICKUP,1,1'
      - 'ORB_PICKUP,1,1.5'
      - 'ORB_PICKUP,1,2'
    showtime: [3, 2, 1]
  newround:
    sounds:
      - 'ORB_PICKUP,1,2'
      - 'NOTE_PLING,1,1'

tip:
  splice: ' '
  hide: '_'

scoreboard:
  waiting:
    refresh: 20
    title: '&a&l等待玩家加入'
    content:
      - '&f'
      - '&6&l时间剩余'
      - '&f15秒'
      - '&f'
      - '&6&l玩家'
      - '&f%count%/%max%'
      - '&f'
      - '&6&l最少玩家'
      - '&f2'
      - '&f--------------'
  starting:
    refresh: 0
    title: '&a&l开始中...'
    content:
      - '&f'
      - '&6&l开始中'
      - '&f%starttime%秒'
      - '&f'
      - '&f'
      - '&f--------------'
  gaming:
    refresh: 20
    title: '&a&l你&2&l画&a&l我&2&l猜'
    content:
      - '&f'
      - '&e&l回合'
      - '&f%round_now%/%round_all%'
      - '&f'
      - '&6&l画手'
      - '&f%builder_player%'
      - '&f'
      - '&e%score% &f%player%'
      - '&f--------------'
  ending:
    refresh: 20
    title: '&c&l游戏结束'
    content:
      - '&f'
      - '&4&l游戏结束中'
      - '&f'
      - '&f--------------'

autojoin:
  enabled: true
  randomjoin: false
  joingame: 'castle'
  bungee: true # true后, enabled+randomjoin强制为true
  lobby: 'lobby'
  full-restart: false # 游戏结束重启服务端

join:
  title: '&a&l你&2&l画&a&l我&2&l猜'
  subtitle: '&7你加入了地图 %game%.'
  fade-in: 0
  stay: 80
  fade-out: 30

motd:
  wait: 'already'
  full: 'full'
  start: 'start'
  ending: 'ending'

kick:
  full: '&c房间已满, 无法加入'
  start: '&c游戏已开始, 无法加入'
  ending: '&c游戏正在结束, 无法加入'