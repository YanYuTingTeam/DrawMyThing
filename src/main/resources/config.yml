  - boat
  - computer
  - river
  - cupcake
  - football
  - chocolate
  - frog
  - night
  - creeper
  - ship
  - bow
  - tree
  - smile
  - watch

item:
  leave:
    material: CLOCK
    data: 0
    slot: 8
    name: '&c返回大厅'
    lore:
      - '&7点击返回大厅'
  pencil:
    material: WOODEN_SWORD
    data: 0
    slot: 0
    name: '&a默认画笔(剑准心对准画布，按住右键作画)'
    lore:
      - '&7右键方块进行绘画'
  big-pencil:
    material: IRON_SWORD
    data: 0
    slot: 1
    name: '&a&l粗画笔(剑准心对准画布，按住右键作画)'
    lore:
      - '&7右键方块进行十字绘画'
  eraser:
    material: TNT
    data: 14
    slot: 2
    name: '&c橡皮擦'
    lore:
      - '&7右键方块擦除为白色'
  color-picker:
    material: BUCKET
    data: 0
    slot: 3
    name: '&a选择颜色'
    lore:
      - '&7右键打开颜色选择'

color-picker:
  title: '选择画笔颜色'
  colors:
    - {wool: 0, name: '&f白色', slot: 0}
    - {wool: 1, name: '&6橙色', slot: 1}
    - {wool: 2, name: '&5品红色', slot: 2}
    - {wool: 3, name: '&b淡蓝色', slot: 3}
    - {wool: 4, name: '&e黄色', slot: 4}
    - {wool: 5, name: '&a黄绿色', slot: 5}
    - {wool: 6, name: '&d粉红色', slot: 6}
    - {wool: 7, name: '&8灰色', slot: 7}
    - {wool: 8, name: '&7淡灰色', slot: 8}
    - {wool: 9, name: '&3青色', slot: 10}
    - {wool: 10, name: '&5紫色', slot: 11}
    - {wool: 11, name: '&9蓝色', slot: 12}
    - {wool: 12, name: '&6棕色', slot: 13}
    - {wool: 13, name: '&2绿色', slot: 14}
    - {wool: 14, name: '&c红色', slot: 15}
    - {wool: 15, name: '&0黑色', slot: 16}

beforestart:
  time: 15
  broadcast:
    sound: 'ORB_PICKUP,1,1'
    title: '&6&l游戏将在 %time% 秒后开始,20,40,20'
  showtime: [10, 5, 4, 3, 2, 1]

game:
  round-time: 75
  hints:
    - 40
    - 50
    - 55
  actionbar: '&f&l提示 &r&f- %tip%'
  builder-actionbar: '&e&l题目: &r&f%paintname%'
  builder-teleport-delay: 1
  round: 2

tip:
  splice: ' '
  hide: '_'

scoreboard:
  waiting:
    refresh: 20
    title: '&a&l等待玩家加入'
    content:
      - '&f'
      - '&6&l时间剩余'
      - '&f15秒'
      - '&f'
      - '&6&l玩家'
      - '&f%count%/%max%'
      - '&f'
      - '&6&l最少玩家'
      - '&f2'
      - '&f--------------'
  starting:
    refresh: 20
    title: '&a&l开始中...'
    content:
      - '&f'
      - '&6&l开始中'
      - '&f%starttime%秒'
      - '&f'
      - '&f'
      - '&f--------------'
  gaming:
    refresh: 20
    title: '&a&l你&2&l画&a&l我&2&l猜'
    content:
      - '&f'
      - '&e&l回合'
      - '&f%round_now%/%round_all%'
      - '&f'
      - '&6&l画手'
      - '&f%builder_player%'
      - '&f'
      - '&e%score% &f%player%'
      - '&f--------------'

autojoin:
  enabled: true
  randomjoin: false
  joingame: 'castle'

join:
  title: '&a&l你&2&l画&a&l我&2&l猜'
  subtitle: '&7你加入了地图 %game%.'
  fade-in: 0
  stay: 40
  fade-out: 20