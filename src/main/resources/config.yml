# 铅笔/橡皮擦音效
tool-sound: true
# 强制晴天
force-clear-weather: true
# 不掉饱食度
no-hunger: true
# 不受伤害
no-damage: true
# 词库
words:
  - motorbike
  - noodle
  - sea
  - ocean
  - leash
  - pumpkin
  - pyramid
  - rainbow
  - witch
  - house
  - santa
  - flower
  - pants
  - donut
  - snake
  - snail
  - yawn
  - stamp
  - horse
