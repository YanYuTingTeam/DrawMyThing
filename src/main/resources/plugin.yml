name: DrawMyThing
version: 1.0.0
main: com.aermini.dmt.DrawMyThing
authors: [ShadowUniverse, AerMini, YukiEnd]
description: DrawMyThing. 横跨12年的更新. 还原《花雨庭》特性
api-version: 1.8

commands:
  dmt:
    description: DrawMyThing main command
    usage: /dmt <subcommand>
    aliases: [drawmything]

permissions:
  dmt.admin:
    description: Allows admin commands (create/delete games, set positions)
    default: op
  dmt.default:
    description: Allows joining and leaving games
    default: true
