name: DrawMyThing
version: 1.0.0
main: com.mrstart.dmt.DrawMyThing
author: mrstart
description: A Draw My Thing minigame plugin
api-version: 1.8

commands:
  dmt:
    description: DrawMyThing main command
    usage: /dmt <subcommand>
    aliases: [drawmything]

permissions:
  dmt.admin:
    description: Allows admin commands (create/delete games, set positions)
    default: op
  dmt.default:
    description: Allows joining and leaving games
    default: true
